name: Deploy docs

# Build do site (VitePress + Scalar) e publicação no GitHub Pages.
# Disparado em todo push na main — inclusive o sync do openapi.json feito
# pelo api-docs.yml do telos-crm (com GitHub App token, que dispara workflows).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          # "/" com domínio próprio; vazio = /docs-cashback/ (github.io)
          DOCS_BASE: ${{ vars.DOCS_BASE }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
